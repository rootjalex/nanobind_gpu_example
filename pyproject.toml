[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nanobind-gpu-example"
version = "0.0.1"
description = "An example minimal project that compiles GPU bindings using nanobind and scikit-build"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander J Root", email = "ajroot@cs.stanford.edu" },
]
dependencies = [
    "torch",
]

[project.urls]
Homepage = "https://github.com/rootjalex/nanobind_gpu_example"

[dependency-groups]
dev = [
    "cmake>=4.0",
    "matplotlib",
    "nanobind>=2.0",
    "numpy",
    "pytest>=8.3.5",
    "scipy",
]

[tool.scikit-build]
cmake.version = ">=4.0"

# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.uv]
# Rebuild the extension when native sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cmake/*.cmake" },
    { file = "src/**/CMakeLists.txt" },
    { file = "src/**/*.h" },
    { file = "src/**/*.cpp" },
    { file = "src/**/*.cu" },
    { file = "src/**/*.metal" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
